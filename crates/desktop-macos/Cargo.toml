[package]
name = "semi-os-desktop-macos"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
semi-os-protocol = { path = "../protocol" }
serde = { version = "1", features = ["derive"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
# AVFoundation 的麦克风授权回调是 Objective-C block；block2 已由 objc2 引入
# 依赖树，这里只是显式声明，不引入新版本。
block2 = "0.6"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSString"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSRunningApplication", "NSWorkspace", "libc"] }
